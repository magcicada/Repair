name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "1.20.1/forge/dev" ]
  pull_request:
    branches: [ "1.20.1/forge/dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 1.20.1/forge branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --info

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Create-Repair-Build
          path: build/libs/
